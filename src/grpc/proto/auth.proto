syntax = "proto3";
package auth.v1;

service AuthService {
  rpc ValidateAccessToken (ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
}

message ValidateAccessTokenRequest { string access_token = 1; }
message ValidateAccessTokenResponse { bool valid = 1; string user_id = 2; string email = 3; }
message GetUserRequest { string user_id = 1; }
message GetUserResponse { bool found = 1; string user_id = 2; string email = 3; bool verified = 4; }
